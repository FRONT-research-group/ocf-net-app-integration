services:
  mongodb:
    container_name: cef-nef-mongo

  nef:
    container_name: cef-nef

    environment:
      MONGO_HOST: mongodb
      MONGO_DB_URI: mongodb://mongodb:27017/

      AUTH_ENABLED: "True"
      ALGORITHM: "RS256"
      PUB_KEY_PATH: "/app/certs/capif_security_server.pub.pem"
      CAPIF_ENFORCE_SCOPE: "True"
      CAPIF_REQUIRED_API_NAME: "3gpp-monitoring-event-cef-124316"
      CAPIF_REQUIRED_AEF_ID: "AEF1385659a79856f9bbd1029ba83c80c"

    volumes:
      - ./MonitoringEventAPI/certs/capif_security_server.pub.pem:/app/certs/capif_security_server.pub.pem:ro

    networks:
      - nef-network
      - capif-network

networks:
  capif-network:
    external: true
    name: capif-network
